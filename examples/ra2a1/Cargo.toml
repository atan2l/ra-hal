[package]
name = "ra2a1"
description = "HAL examples for the Renesas RA2A1 group of MCUs."
license = "GPL-3.0-or-later"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
version.workspace = true

[dependencies]
## Core dependencies
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
panic-probe = { workspace = true }
critical-section = { workspace = true }

## Embassy dependencies
# embassy-embedded-hal = { version = "0.5.0", default-features = false }
embassy-executor = { workspace = true }
embassy-hal-internal = { workspace = true }
embassy-time = { workspace = true }
# embassy-futures = { version = "0.1.2" }
embedded-hal-1 = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-io = { workspace = true }
embedded-io-async = { workspace = true }

## Board stuff
ra-hal = { workspace = true, features = [ "unstable-pac", "ra2a1" ] }

## Third party libraries
assign-resources = { workspace = true }
micromath = { workspace = true }

[build-dependencies]
vergen-gitcl = { version = "9" }

[features]
default = [ "defmt", "strict-assert", "ek-ra2a1" ]
defmt = [
  "dep:defmt",
  "dep:defmt-rtt",
  "panic-probe/print-defmt",
  "embassy-executor/defmt",
  "embassy-time/defmt",
  "embassy-time/defmt-timestamp-uptime",
  "ra-hal/defmt",
]
strict-assert = [ "ra-hal/strict-assert" ]
ek-ra2a1 = [ "ra-hal/64lqfp", "ra-hal/hoco_48mhz", "ra-hal/time-driver-gpt0", "embassy-time/tick-hz-48_000_000" ]
