[package]
name = "ra4-examples"
version = "0.1.0-dev"
description = "HAL examples for the Renesas RA4 family of MCUs."
license = "GPL-3.0-or-later"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true

[dependencies]
## Core dependencies
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { version = "1.0.0", optional = true }
panic-probe = { version = "1.0.0" }
critical-section = { workspace = true }

## Embassy dependencies
# embassy-embedded-hal = { version = "0.5.0", default-features = false }
embassy-executor = { version = "0.9.0", features = [ "arch-cortex-m", "executor-thread", "executor-interrupt" ] }
embassy-time = { workspace = true }
# embassy-futures = { version = "0.1.2" }
embedded-io = { workspace = true }
embedded-io-async = { workspace = true }

## Board stuff
ra4-hal = { path = "../ra4-hal", features = [ "unstable-pac" ] }
uno-r4wifi-bsc = { path = "../uno-r4wifi-bsc" }

## Third party stuff
atomic_float = { version = "1.1.0", default-features = false }
heapless = { version = "0.9.2" }
micromath="2.1"

## For the I2C example
# embedded-graphics = { version = "0.8.1" }
# ssd1306 = { version = "0.10.0" }

[build-dependencies]
vergen-gitcl = { version = "1.0.8" }

[features]
default = [ "defmt", "strict-assert" ]
defmt = [ "dep:defmt", "dep:defmt-rtt", "panic-probe/print-defmt", "embassy-executor/defmt", "embassy-time/defmt", "embassy-time/defmt-timestamp-uptime", "ra4-hal/defmt", "uno-r4wifi-bsc/defmt" ]
strict-assert = [ "ra4-hal/strict-assert" ]
