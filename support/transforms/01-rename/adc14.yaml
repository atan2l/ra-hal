transforms:
  - !RenamePeripherals
    from: ADC140
    to: ADC14
  - !Rename
    from: adc140::(.+)
    to: adc14::${1}
    type: All
  - !Rename
    from: adc14::Adc140
    to: adc14::Adc14
    type: Block
  - !MakeFieldArray
    fieldsets: adc14::regs::(Adansa[01])
    from: (ansa)\d+
    to: ${1}
  - !RenameEnumVariants
    enum: adc14::vals::Adcs
    from: _00
    to: Single
  - !RenameEnumVariants
    enum: adc14::vals::Adcs
    from: _01
    to: Group
  - !RenameEnumVariants
    enum: adc14::vals::Adcs
    from: _10
    to: Continuous
  - !RenameEnumVariants
    enum: adc14::vals::Adcs
    from: _11
    to: Prohibited
  # Mask is 0xFFFF
  # ADCMPDR0|ADCMPDR1|ADWINLLB|ADWINULB|ADDBLDR|ADDBLDRA|ADDBLDRB|ADTSDR|ADOCDR|ADDRy|ADDR2: any value is valid.
  - !DeleteFieldsets
    from: adc14::regs::(Adcmpdr[01]|Adwin[ul]lb|Addbldr[ab]?|Adtsdr|Adocdr|Addr2?)
  # Mask is 0xFF
  # ADSSTRy|ADSSTRL|ADSSTRO|ADSSTRT|ADSSTRO: any value is valid.
  - !DeleteFieldsets
    from: adc14::regs::(Adsstr[lot]?)
