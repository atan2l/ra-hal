# The differences between SPI0 and SPI1 are that
# in SPI0 SPDCR has 2, 2-byte reserved fields
# and in SPI1 there is 1, 4-byte reserved field.
transforms:
  - !MergeBlocks
      from: spi[01]::Spi[01]
      to: spi::Spi
  - !Rename
      from: spi0::(.+)
      to: spi::${1}
      type: All
  - !Delete
      from: spi1::(.+)
      type: All
