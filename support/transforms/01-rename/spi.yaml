# The difference between SPI0 and SPI1 is that SPI0.SPDCR has 2, 2-byte reserved fields
# while SPI1.SPDCR has is 1, 4-byte reserved field.
transforms:
  - !MergeBlocks
    from: spi[01]::Spi[01]
    to: spi::Spi
  - !Rename
    from: spi0::(.+)
    to: spi::${1}
    type: All
  - !Delete
    from: spi1::(.+)
    type: All
  # Mask is 0xFF
  # SPBR: any value is valid.
  - !DeleteFieldsets
    from: spi::regs::Spbr
  # Mask is 0xFFFFFFFF
  # SPDR: any value is valid.
  - !DeleteFieldsets
    from: spi::regs::Spdr
  # Mask is 0xFFFFF
  # SPDR_HA: any value is valid.
  - !DeleteFieldsets
    from: spi::regs::SpdrHa
