# Note that SCI0 and SCI1 have 16-byte FIFOs, SCI2 and SCI9 do not.
# FIFO registers: SSR_FIFO, FTDRH, FTDRHL, FTDRL, FDRH, FRDRH, FRDRL, FCR, FDR, LSR
transforms:
  - !MergeBlocks
    from: sci[0129]::Sci[0129]
    to: sci::Sci
  - !Rename
    from: sci0::(.+)
    to: sci::${1}
    type: All
  - !Delete
    from: sci[129]::(.+)
    type: All
  - !RenameEnumVariants
    enum: sci::vals::Stop
    from: _0
    to: Stop1
  - !RenameEnumVariants
    enum: sci::vals::Stop
    from: _1
    to: Stop2
  - !RenameEnumVariants
    enum: sci::vals::(.+)Pm
    from: _0
    to: Even
  - !RenameEnumVariants
    enum: sci::vals::(.+)Pm
    from: _1
    to: Odd
  - !RenameEnumVariants
    enum: sci::vals::SmrCks
    from: _00
    to: DIV_1
  - !RenameEnumVariants
    enum: sci::vals::SmrCks
    from: _01
    to: DIV_4
  - !RenameEnumVariants
    enum: sci::vals::SmrCks
    from: _10
    to: DIV_16
  - !RenameEnumVariants
    enum: sci::vals::SmrCks
    from: _11
    to: DIV_64
  # FIFO trigger depth, mask is 0x0F, any value is valid.
  - !DeleteEnums
    from: sci::vals::Ttrg
  # Mask is 0xFF
  # BRR|FTDRL|FRDRL|RDR: any value is valid.
  # MDDR: 128 ≤ n ≤ 255 (no way to capture this in chiptool so might as well nuke it)
  - !DeleteFieldsets
    from: sci::regs::(Brr|Mddr|F[rt]drl|[RT]dr)
  # Mask is 0xFFFF
  # RDRHL|TDRHL: any value is valid.
  - !DeleteFieldsets
    from: sci::regs::([RT]drhl)
