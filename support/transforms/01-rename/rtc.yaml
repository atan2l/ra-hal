transforms:
  - !RenameEnumVariants
    enum: rtc::vals::Rcksel
    from: _0
    to: SubClock
  - !RenameEnumVariants
    enum: rtc::vals::Rcksel
    from: _1
    to: Loco
  - !RenameEnumVariants
    enum: rtc::vals::RwkcntDayw
    from: _000
    to: Sunday
  - !RenameEnumVariants
    enum: rtc::vals::RwkcntDayw
    from: _001
    to: Monday
  - !RenameEnumVariants
    enum: rtc::vals::RwkcntDayw
    from: _010
    to: Tuesday
  - !RenameEnumVariants
    enum: rtc::vals::RwkcntDayw
    from: _011
    to: Wednesday
  - !RenameEnumVariants
    enum: rtc::vals::RwkcntDayw
    from: _100
    to: Thursday
  - !RenameEnumVariants
    enum: rtc::vals::RwkcntDayw
    from: _101
    to: Friday
  - !RenameEnumVariants
    enum: rtc::vals::RwkcntDayw
    from: _110
    to: Saturday
  # Mask is 0xFF
  # BCNT0|BCNT1|BCNT2|BCNT3: any value is valid.
  - !DeleteFieldsets
    from: rtc::regs::Bcnt[0123]
  # Mask is 0xFFFF
  # RFRL: 7 ≤ n ≤ 0x01FF (no way to capture this in chiptool so might as well nuke it)
  - !DeleteFieldsets
    from: rtc::regs::Rfrl
