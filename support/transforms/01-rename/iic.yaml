# NOTE: Check the manual for the actual differenes between IIC0 and IIC1.
# They are *not* identical.
transforms:
  - !MergeBlocks
      from: iic[01]::Iic[01]
      to: iic::Iic
  - !Rename
      from: iic0::(.+)
      to: iic::${1}
      type: All
  - !Delete
      from: iic1::(.+)
      type: All
