# TN-RA*-A0033A/E
transforms:
  - !AddFields
    fieldset: spi::regs::Spdcr
    fields:
      - !Field
        name: spbyt
        description: SPI Byte Access Specification
        bit_offset: 6
        bit_size: 1
        enum: spi::vals::Spbyt
  - !AddFields
    fieldset: spi::regs::Spcr2
    fields:
      - !Field
        name: sptddl
        description: RSPI Transmit Data Delay
        bit_offset: 5
        bit_size: 3
  - !AddFields
    fieldset: spi::regs::Spdsr
    fields:
      - !Field
        name: cendf
        description: Communication End Flag
        bit_offset: 6
        bit_size: 1
  - !AddRegisters
    block: spi::Spi
    registers:
      - !BlockItem
        name: spdcr2
        description: SPI Data Control Register 2
        byte_offset: 0x20
        bit_size: 8
        fieldset: spi::regs::Spdcr2
  - !AddRegisters
    block: spi::Spi
    registers:
      - !BlockItem
        name: spdr_by
        description: SPI Data Register ( byte access )
        byte_offset: 0x04
        bit_size: 8
  - !Add
    ir: !IR
      fieldset/spi::regs::Spdcr2: !Fieldset
        bit_size: 8
        fields:
          - !Field
            name: bysw
            description: Byte Swap Operating Mode Select
            bit_offset: 0
            bit_size: 1
            enum: spi::vals::Bysw
          - !Field
            name: sinv
            description: Serial data invert bit
            bit_offset: 1
            bit_size: 1
      enum/spi::vals::Bysw: !Enum
        bit_size: 1
        # TODO: Check that these are the correct labels
        variants:
          - !EnumVariant
            name: Little
            value: 0x00
          - !EnumVariant
            name: Big
            value: 0x01
      enum/spi::vals::Spbyt: !Enum
        bit_size: 1
        variants:
          - !EnumVariant
            name: Word
            value: 0x00
            description: SPDR is accessed in halfword or word (SPLW is valid).
          - !EnumVariant
            name: Byte
            value: 0x01
            description: SPDR is accessed in byte (SPLW is invalid).
