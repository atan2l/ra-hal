# Note: AN15 and AN26..=AN31 do not exist.
# Proceed with caution.
transforms:
  - !DeleteRegisters
    block: adc14::Adc14
    from: addr(2)?
  - !AddRegisters
    block: adc14::Adc14
    registers:
      - !BlockItem
        name: addr
        description: A/D Data Register n
        byte_offset: 0x20
        bit_size: 16
        array: { len: 32, stride: 2 }
  - !DeleteRegisters
    block: adc14::Adc14
    from: adansa[01]
  - !DeleteFieldsets
    from: adc14::regs::Adansa[01]
  # Right-o.  These are in fact two separate 16 bit values.
  # So AN019 would be the 3rd bit in a 32LE value.
  - !AddRegisters
    block: adc14::Adc14
    registers:
      - !BlockItem
        name: adansa
        description: A/D Channel Select Registers A0 and A1
        byte_offset: 0x04
        bit_size: 16
        array: { len: 2, stride: 2 }
        fieldset: adc14::regs::Adans
  - !DeleteRegisters
    block: adc14::Adc14
    from: adansb[01]
  - !DeleteFieldsets
    from: adc14::regs::Adansb[01]
  - !AddRegisters
    block: adc14::Adc14
    registers:
      - !BlockItem
        name: adansb
        description: A/D Channel Select Registers B0 and B1
        byte_offset: 0x14
        bit_size: 16
        array: { len: 2, stride: 2 }
        fieldset: adc14::regs::Adans
  - !Add
    ir: !IR
      fieldset/adc14::regs::Adans: !Fieldset
        bit_size: 16
        description: A/D Channel Select Registers A0,A1 or B0,B1
        fields:
          - !Field
            name: ans
            description: ANnnn Select
            bit_offset: 0
            bit_size: 1
            array: { len: 16, stride: 1 }
  - !DeleteRegisters
    block: adc14::Adc14
    from: adads[01]
  - !DeleteFieldsets
    from: adc14::regs::Adads[01]
  - !AddRegisters
    block: adc14::Adc14
    registers:
      - !BlockItem
        name: adads
        description: A/D-Converted Value Addition/Average Channel Select Registers 0 and 1
        byte_offset: 8
        bit_size: 16
        array: { len: 2, stride: 2 }
        fieldset: adc14::regs::Adads
  - !Add
    ir: !IR
      fieldset/adc14::regs::Adads: !Fieldset
        bit_size: 16
        description: A/D-Converted Value Addition/Average Channel Select Registers 0 and 1
        fields:
          - !Field
            name: ads
            description: A/D-Converted Value Addition/Average Channel ANnnn Select
            bit_offset: 0
            bit_size: 1
            array: { len: 16, stride: 1 }
