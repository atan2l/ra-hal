transforms:
  - !DeleteRegisters
    block: icu::Icu
    from: irqcr(2)?
  - !AddRegisters
    block: icu::Icu
    registers:
      - !BlockItem
        name: irqcr
        description: IRQ Control Register %s
        fieldset: icu::regs::Irqcr
        byte_offset: 0x00
        bit_size: 8
        array: { len: 16, stride: 1 }
  - !DeleteFieldsets
    from: icu::regs::Irqcr2
  - !DeleteEnums
    from: icu::vals::Irqcr2.+
  - !Rename
    from: icu::vals::Irqcr(Irqmd|Fclksel)
    to: icu::vals::${1}
