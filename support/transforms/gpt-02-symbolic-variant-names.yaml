transforms:
  - !MapEnumVariants
    enum: gpt::vals::Ud
    variants:
      _0: Down
      _1: Up
  - !Rename
    from: gpt::vals::Md
    to: gpt::vals::Mode
  - !MapEnumVariants
    enum: gpt::vals::Mode
    variants:
      _000: SawWavePwm
      _001: SawWaveOneShot
      _100: TrianglePwm1
      _101: TrianglePwm2
      _110: TrianglePwm3
  - !MapEnumVariants
    enum: gpt::vals::Tpcs
    variants:
      _000: DIV_1
      _001: DIV_4
      _010: DIV_16
      _011: DIV_64
      _100: DIV_256
      _101: DIV_1024
  # Leaving these as discrete types so we maintain meaningful comments
  - !MapEnumVariants
    enum: gpt::vals::Ccr[ab]
    variants:
      _00: NoBuffer
      _01: SingleBuffer
      _10: DoubleBuffer
    descriptions:
      _01: Single buffer operation (GTCCRA↔GTCCRC or GTCCRB↔GTCCRE)
      _10: Double buffer operation (GTCCRA↔GTCCRC↔GTCCRD or GTCCRB↔GTCCRE↔GTCCRF)
  - !MergeEnums
    from: gpt::vals::O[ab]dty
    to: gpt::vals::Odty
    main: gpt::vals::Oadty
  - !MapEnumVariants
    enum: gpt::vals::Odty
    variants:
      _00: CompareMatch
      _10: Off
      _11: On
    descriptions:
      _00: GTIOCA/B pin duty is depend on compare match
      _10: GTIOCA/B pin duty 0 percent
      _11: GTIOCA/B pin duty 100 percent
  - !MapEnumVariants
    enum: gpt::vals::Gtioa
    descriptions:
      _00000: Initial output is Low. Output retained at cycle end. Output retained at GTCCRA/B compare match
      _00001: Initial output is Low. Output retained at cycle end. Low output at GTCCRA/B compare match.
      _00010: Initial output is Low. Output retained at cycle end. High output at GTCCRA/B compare match.
      _00011: Initial output is Low. Output retained at cycle end. Output toggled at GTCCRA/B compare match.
      _00100: Initial output is Low. Low output at cycle end. Output retained at GTCCRA/B compare match.
      _00101: Initial output is Low. Low output at cycle end. Low output at GTCCRA/B compare match.
      _00110: Initial output is Low. Low output at cycle end. High output at GTCCRA/B compare match.
      _00111: Initial output is Low. Low output at cycle end. Output toggled at GTCCRA/B compare match.
      _01000: Initial output is Low. High output at cycle end. Output retained at GTCCRA/B compare match.
      _01001: Initial output is Low. High output at cycle end. Low output at GTCCRA/B compare match.
      _01010: Initial output is Low. High output at cycle end. High output at GTCCRA/B compare match.
      _01011: Initial output is Low. High output at cycle end. Output toggled at GTCCRA/B compare match.
      _01100: Initial output is Low. Output toggled at cycle end. Output retained at GTCCRA/B compare match.
      _01101: Initial output is Low. Output toggled at cycle end. Low output at GTCCRA/B compare match.
      _01110: Initial output is Low. Output toggled at cycle end. High output at GTCCRA/B compare match.
      _01111: Initial output is Low. Output toggled at cycle end. Output toggled at GTCCRA/B compare match.
      _10000: Initial output is High. Output retained at cycle end. Output retained at GTCCRA/B compare match.
      _10001: Initial output is High. Output retained at cycle end. Low output at GTCCRA/B compare match.
      _10010: Initial output is High. Output retained at cycle end. High output at GTCCRA/B compare match.
      _10011: Initial output is High. Output retained at cycle end. Output toggled at GTCCRA/B compare match.
      _10100: Initial output is High. Low output at cycle end. Output retained at GTCCRA/B compare match.
      _10101: Initial output is High. Low output at cycle end. Low output at GTCCRA/B compare match.
      _10110: Initial output is High. Low output at cycle end. High output at GTCCRA/B compare match.
      _10111: Initial output is High. Low output at cycle end. Output toggled at GTCCRA/B compare match.
      _11000: Initial output is High. High output at cycle end. Output retained at GTCCRA/B compare match.
      _11001: Initial output is High. High output at cycle end. Low output at GTCCRA/B compare match.
      _11010: Initial output is High. High output at cycle end. High output at GTCCRA/B compare match.
      _11011: Initial output is High. High output at cycle end. Output toggled at GTCCRA/B compare match.
      _11100: Initial output is High. Output toggled at cycle end. Output retained at GTCCRA/B compare match.
      _11101: Initial output is High. Output toggled at cycle end. Low output at GTCCRA/B compare match.
      _11110: Initial output is High. Output toggled at cycle end. High output at GTCCRA/B compare match.
      _11111: Initial output is High. Output toggled at cycle end. Output toggled at GTCCRA/B compare match.
