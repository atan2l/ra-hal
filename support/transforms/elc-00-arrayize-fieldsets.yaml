
transforms:
  - !DeleteRegisters
    block: elc::Elc
    from: elsr(\d*)
  - !AddRegisters
    block: elc::Elc
    registers:
      - !BlockItem
        name: elsr
        description: Event Link Setting Register %s
        fieldset: elc::regs::Elsr
        byte_offset: 0x10
        bit_size: 16
        # Indicies are: 0..=9, 12, 14..=18
        # Would be nice to have an alternative to CursedArray that simply rejects the holes intead of collapsing them contiguous indicies
        array: { len: 19, stride: 4 }
  - !DeleteFieldsets
    from: elc::regs::Elsr(\d+)
  - !DeleteEnums
    from: elc::vals::Elsr(\d+)\w+
