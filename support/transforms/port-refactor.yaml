# PORT1 adds ELC registers to PORT0: EDIR, EOSR, PCNTR4
# PORT1..=PORT4 derive from PORT1, all others from PORT0
transforms:
  - !MergeBlocks
    from: port[01]::Port[01]
    to: port::Port
    main: port1::Port1
  - !Rename
    from: port1::(.+)
    to: port::${1}
    type: All
  - !Delete
    from: port0::(.+)
    type: All
  - !DeleteFields
    fieldset: port::regs::Pcntr1
    from: (podr|pdr)
  - !AddFields
    fieldset: port::regs::Pcntr1
    fields:
      - name: pdr
        bit_offset: 0
        bit_size: 1
        array: { len: 16, stride: 1 }
      - name: podr
        bit_offset: 16
        bit_size: 1
        array: { len: 16, stride: 1 }
  - !DeleteFields
    fieldset: port::regs::(Eidr|Eorr|Eosr|Pidr|Podr|Porr|Posr)
    from: .+
  - !DeleteEnums
    from: port::vals::(Eidr|Eorr|Eosr|Pidr|Podr|Porr|Posr){2}
  - !AddFields
    fieldset: port::regs::Eorr
    fields:
      - name: eorr
        description: Pmn Event Output Reset Register (level=low)
        bit_offset: 0
        bit_size: 1
        array: { len: 16, stride: 1 }
  - !AddFields
    fieldset: port::regs::Eosr
    fields:
      - name: eosr
        description: Pmn Event Output Set Register (level=high)
        bit_offset: 0
        bit_size: 1
        array: { len: 16, stride: 1 }
  - !AddFields
    fieldset: port::regs::Eidr
    fields:
      - name: eidr
        description: Pmn Event Input Data
        bit_offset: 0
        bit_size: 1
        array: { len: 16, stride: 1 }
  - !AddFields
    fieldset: port::regs::Pidr
    fields:
      - name: pidr
        description: Pmn Input Data
        bit_offset: 0
        bit_size: 1
        array: { len: 16, stride: 1 }
  - !AddFields
    fieldset: port::regs::Podr
    fields:
      - name: podr
        description: Pmn Output Data
        bit_offset: 0
        bit_size: 1
        array: { len: 16, stride: 1 }
  - !AddFields
    fieldset: port::regs::Porr
    fields:
      - name: porr
        description: Pmn Output Reset Register (level=low)
        bit_offset: 0
        bit_size: 1
        array: { len: 16, stride: 1 }
  - !AddFields
    fieldset: port::regs::Posr
    fields:
      - name: posr
        description: Pmn Output Set Register (level=high)
        bit_offset: 0
        bit_size: 1
        array: { len: 16, stride: 1 }
  - !DeleteFields
    fieldset: port::regs::Pcntr2
    from: (pidr|eidr)
  - !AddFields
    fieldset: port::regs::Pcntr2
    fields:
      - name: pidr
        description: Pmn Input Data
        bit_offset: 0
        bit_size: 1
        array: { len: 16, stride: 1 }
  - !AddFields
    fieldset: port1::regs::Pcntr2
    fields:
      - name: eidr
        description: Pmn Event Input Data
        bit_offset: 16
        bit_size: 1
        array: { len: 16, stride: 1 }
  - !DeleteFields
    fieldset: port::regs::Pcntr3
    from: (porr|posr)
  - !AddFields
    fieldset: port::regs::Pcntr3
    fields:
      - name: posr
        description: Pmn Output Set (high)
        bit_offset: 0
        bit_size: 1
        array: { len: 16, stride: 1 }
      - name: porr
        description: Pmn Output Reset (low)
        bit_offset: 16
        bit_size: 1
        array: { len: 16, stride: 1 }
