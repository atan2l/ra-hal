transforms:
  # Any address is valid
  - !DeleteFieldsets
    from: dmac::regs::Dm[ds]ar
  # Any count is valid
  - !DeleteFieldsets
    from: dmac::regs::Dmcrb
  # 0x0000_0000..=0x00FF_FFFF is valid
  # 0xFF00_0000..=0xFFFF_FFFF is valid
  # It's a 24-bit register with caveats, read the manual.
  - !DeleteFieldsets
    from: dmac::regs::Dmofr
