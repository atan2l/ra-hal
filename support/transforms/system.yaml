transforms:
  - !RenameEnumVariants
      enum: system::vals::Hcstp
      from: _0
      to: Start
  - !RenameEnumVariants
      enum: system::vals::Hcstp
      from: _1
      to: Stop
  - !RenameEnumVariants
      enum: system::vals::Prc[013]
      from: _0
      to: Protected
  - !RenameEnumVariants
      enum: system::vals::Prc[013]
      from: _1
      to: NotProtected
  - !RenameEnumVariants
      enum: system::vals::Opcm
      from: _00
      to: HighSpeed
  - !RenameEnumVariants
      enum: system::vals::Opcm
      from: _01
      to: MidSpeed
  - !RenameEnumVariants
      enum: system::vals::Opcm
      from: _10
      to: LowVoltage
  - !RenameEnumVariants
      enum: system::vals::Opcm
      from: _11
      to: LowSpeed
  - !DeleteEnumVariants
      enum: system::vals::Prkey
      from: _0X5A
  - !DeleteEnums
      from: system::vals::(Memwait|Opcmtsf)
  - !RenameEnumVariants
      enum: system::vals::Cksel
      from: _000
      to: Hoco
  - !RenameEnumVariants
      enum: system::vals::Cksel
      from: _001
      to: Moco
  - !RenameEnumVariants
      enum: system::vals::Cksel
      from: _010
      to: Loco
  - !RenameEnumVariants
      enum: system::vals::Cksel
      from: _011
      to: Mosc
  - !RenameEnumVariants
      enum: system::vals::Cksel
      from: _100
      to: Sosc
  - !RenameEnumVariants
      enum: system::vals::Cksel
      from: _101
      to: Pll
  - !AddRegisters
      block: system::System
      registers:
          - !BlockItem
              name: hococr2
              description: |
                  High-Speed On-Chip Oscillator Control Register2
                  Note1: Writing to the HOCOCR2 is prohibited when the HOCOCR.HCSTP bit is 0.
                  Note2: Set the PRCR.PRC0 bit to 1 (write enabled) before rewriting this register.
                  Note3: Value after reset of the HCFRQ1[2:0] bits depend on OFS1.HOCOFRQ1[2:0] bits.
              byte_offset: 0x37
              bit_size: 8
              fieldset: system::regs::Hococr2
  - !Add
      ir:
        !IR
            fieldset/system::regs::Hococr2:
                !Fieldset
                    bit_size: 8
                    fields:
                      - !Field
                          name: hcfrqw
                          bit_offset: 3
                          bit_size: 3
                          enum: system::vals::Hcfrq1
            enum/system::vals::Hcfrq1:
                !Enum
                    bit_size: 3
                    description: Reserved values are prohibited
                    variants:
                      - !EnumVariant
                          name: _24mhz
                          description: 24 MHz
                          value: 0x00
                      - !EnumVariant
                          name: _32mhz
                          description: 32 MHz
                          value: 0x02
                      - !EnumVariant
                          name: _48mhz
                          description: 48 MHz
                          value: 0x04
                      - !EnumVariant
                          name: _64mhz
                          description: 64 MHz
                          value: 0x05
            enum/system::vals::Prkey:
                !Enum
                    bit_size: 8
                    variants:
                      - !EnumVariant
                          name: PROTECT_KEY
                          value: 0xA5

