# NOTE: Check the manual for the actual differenes between IIC0 and IIC1.
# They are *not* identical.
transforms:
  - !MergeBlocks
      from: iic[01]::Iic[01]
      to: iic::Iic
  - !Rename
      from: iic0::regs::(.+)
      to: iic::regs::${1}
      type: Fieldset
  - !Rename
      from: iic0::vals::(.+)
      to: iic::vals::${1}
      type: Enum
  - !DeleteRegisters
      block: iic[01]::Iic\d
      from: .+
  - !DeleteFieldsets
      from: iic[01]::regs::.+
  - !DeleteEnums
      from: iic[01]::vals::.+
