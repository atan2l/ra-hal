transforms:
  - !AddPeripherals
    devices: .*
    peripherals:
      - name: OSM
        description: Option Setting Memory
        base_address: 0x00000400
        block: osm::Osm
  - !Add
    ir:
      # These are left as read-only because they're set at compile time via the HAL.
      block/osm::Osm:
        items:
          - name: ofs0
            description: Option Function Select Register 0 (OFS0)
            access: Read
            byte_offset: 0
            bit_size: 32
            fieldset: osm::regs::Ofs0
          - name: ofs1
            description: Option Function Select Register 1 (OFS1)
            access: Read
            byte_offset: 4
            bit_size: 32
            fieldset: osm::regs::Ofs1
      fieldset/osm::regs::Ofs0:
        fields:
          - name: iwdtstrt
            description: IWDT Start Mode Select
            bit_offset: 1
            bit_size: 1
            enum: osm::vals::StartMode
          - name: iwdttops
            description: IWDT Timeout Period Select
            bit_offset: 2
            bit_size: 2
            enum: osm::vals::IwdtTops
          - name: iwdtcks
            description: IWDT-Dedicated Clock Frequency Division Ratio Select
            bit_offset: 4
            bit_size: 4
            enum: osm::vals::IwdtCks
          - name: iwdtrpes
            description: IWDT Window End Position Select
            bit_offset: 8
            bit_size: 2
            enum: osm::vals::Rpes
          - name: iwdtrpss
            description: IWDT Window Start Position Select
            bit_offset: 10
            bit_size: 2
            enum: osm::vals::Rpss
          - name: iwdtrstirqs
            description: IWDT Reset Interrupt Request Select
            bit_offset: 12
            bit_size: 1
            enum: osm::vals::UnderflowAction
          - name: iwdtstpctl
            description: IWDT Stop Control
            bit_offset: 14
            bit_size: 1
          - name: wdtstrt
            description: WDT Start Mode Select
            bit_offset: 17
            bit_size: 1
            enum: osm::vals::StartMode
          - name: wdttops
            description: WDT Timeout Period Select
            bit_offset: 18
            bit_size: 2
            enum: osm::vals::WdtTops
          - name: wdtcks
            description: WDT Clock Frequency Division Ratio Select
            bit_offset: 20
            bit_size: 4
            enum: osm::vals::WdtCks
          - name: wdtrpes
            description: WDT Window End Position Select
            bit_offset: 24
            bit_size: 2
            enum: osm::vals::Rpes
          - name: wdtrpss
            description: WDT Window Start Position Select
            bit_offset: 24
            bit_size: 2
            enum: osm::vals::Rpss
          - name: wdtrstirqs
            description: WDT Reset Interrupt Request Select
            bit_offset: 28
            bit_size: 1
            enum: osm::vals::UnderflowAction
          - name: wdtstpctl
            description: WDT Stop Control
            bit_offset: 30
            bit_size: 1
      fieldset/osm::regs::Ofs1:
        fields:
          - name: lvdas
            description: Voltage Detection 0 Circuit Start
            bit_offset: 2
            bit_size: 1
          - name: vdsel1
            description: Voltage Detection 0 Level Select
            bit_offset: 3
            bit_size: 3
            enum: osm::vals::Vdsel1
          - name: hocoen
            description: HOCO Oscillation Enable
            bit_offset: 8
            bit_size: 1
            enum: osm::vals::HocoEnable
          - name: hocofrq
            description: HOCO Frequency Setting 1
            bit_offset: 12
            bit_size: 3
            enum: osm::vals::HocoFrq
      enum/osm::vals::Vdsel1: !Enum
        bit_size: 3
        variants:
          - !EnumVariant
            name: Volt384
            description: Selects 3.84 V. 
            value: 0b000
          - !EnumVariant
            name: Volt282
            description: Selects 2.82 V. 
            value: 0b001
          - !EnumVariant
            name: Volt251
            description: Selects 2.51 V. 
            value: 0b010
          - !EnumVariant
            name: Volt190
            description: Selects 1.90 V. 
            value: 0b011
          - !EnumVariant
            name: Volt170
            description: Selects 1.70 V. 
            value: 0b100
      enum/osm::vals::HocoEnable: !Enum
        # Because this is a reasonable use of boolean values…
        bit_size: 1
        variants:
          - !EnumVariant
            name: Enable
            description: Enable HOCO oscillation after a reset.
            value: 0
          - !EnumVariant
            name: Disable
            description: Disable HOCO oscillation after a reset.
            value: 1
      enum/osm::vals::HocoFrq: !Enum
        bit_size: 3
        variants:
          - !EnumVariant
            name: Mhz24
            value: 0b000
          - !EnumVariant
            name: Mhz32
            value: 0b010
          - !EnumVariant
            name: Mhz48
            value: 0b100
          - !EnumVariant
            name: Mhz64
            value: 0b101
      enum/osm::vals::StartMode: !Enum
        bit_size: 1
        variants:
          - !EnumVariant
            name: AutoStart
            description: Automatically activate after a reset (auto-start mode).
            value: 0
          - !EnumVariant
            name: Disabled
            description: Stop after a reset (register-start mode).
            value: 1
      enum/osm::vals::UnderflowAction: !Enum
        bit_size: 1
        variants:
          - !EnumVariant
            name: Interrupt
            value: 0
          - !EnumVariant
            name: Reset
            value: 1
      enum/osm::vals::IwdtTops: !Enum
        bit_size: 2
        variants:
          - !EnumVariant
            name: _128
            description: 128 cycles (007Fh).
            value: 0b00
          - !EnumVariant
            name: _512
            description: 512 cycles (01FFh).
            value: 0b01
          - !EnumVariant
            name: _1024
            description: 1024 cycles (03FFh).
            value: 0b10
          - !EnumVariant
            name: _2048
            description: 2048 cycles (07FFh).
            value: 0b11
      enum/osm::vals::IwdtCks: !Enum
        bit_size: 4
        variants:
          - !EnumVariant
            name: _1
            description: "`IWDTCLK/1`"
            value: 0b0000
          - !EnumVariant
            name: _16
            description: "`IWDTCLK/16`"
            value: 0b0010
          - !EnumVariant
            name: _32
            description: "`IWDTCLK/32`"
            value: 0b0011
          - !EnumVariant
            name: _64
            description: "`IWDTCLK/64`"
            value: 0b0100
          - !EnumVariant
            name: _128
            description: "`IWDTCLK/128`"
            value: 0b1111
          - !EnumVariant
            name: _256
            description: "`IWDTCLK/256`"
            value: 0b0101
      enum/osm::vals::Rpes: !Enum
        bit_size: 2
        variants:
          - !EnumVariant
            name: End75Pct
            description: Window end position = 75%.
            value: 0b00
          - !EnumVariant
            name: End50Pct
            description: Window end position = 50%.
            value: 0b01
          - !EnumVariant
            name: End25Pct
            description: Window end position = 25%.
            value: 0b10
          - !EnumVariant
            name: None
            description: Window end position = 0% (no window end position).
            value: 0b11
      enum/osm::vals::Rpss: !Enum
        bit_size: 2
        variants:
          - !EnumVariant
            name: Start25Pct
            description: Window start position = 25%.
            value: 0b00
          - !EnumVariant
            name: Start50Pct
            description: Window start position = 50%.
            value: 0b01
          - !EnumVariant
            name: Start75Pct
            description: Window start position = 75%.
            value: 0b10
          - !EnumVariant
            name: None
            description: Window start position = 100% (no window start position).
            value: 0b11
      enum/osm::vals::WdtTops: !Enum
        bit_size: 2
        variants:
          - !EnumVariant
            name: _1024
            descrioption: 1024 cycles (03FFh).
            value: 0b00
          - !EnumVariant
            name: _4096
            description: 4096 cycles (0FFFh).
            value: 0b01
          - !EnumVariant
            name: _8192
            description: 8192 cycles (1FFFh).
            value: 0b10
          - !EnumVariant
            name: _16384
            description: 16384 cycles (3FFFh).
            value: 0b11
      enum/osm::vals::WdtCks: !Enum
        bit_size: 4
        variants:
          - !EnumVariant
            name: _4
            description: "`PCLKB/1`"
            value: 0b0001
          - !EnumVariant
            name: _64
            description: "`PCLKB/64`"
            value: 0b0100
          - !EnumVariant
            name: _128
            description: "`PCLKB/128`"
            value: 0b1111
          - !EnumVariant
            name: _512
            description: "`PCLKB/512`"
            value: 0b0110
          - !EnumVariant
            name: _2048
            description: "`PCLKB/2048`"
            value: 0b0111
          - !EnumVariant
            name: _8192
            description: "`PCLKB/8192`"
            value: 0b1000
